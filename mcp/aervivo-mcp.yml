name: Aervivo Site MCP (Wix Site MCP runtime)
description: >-
  Aervivo's marketing site (www.aervivo.com) is built on Wix, and Wix serves a Model Context
  Protocol endpoint at /_api/mcp on the site's own host. A tools/list call returned HTTP 200 with
  nine tools, so an agent can reach Aervivo site content over MCP today without credentials.
  AUTHORSHIP: the tool set is the stock Wix Site MCP runtime, not a server Aervivo designed —
  every Wix tenant serves this same shape. It exposes public site content and Wix platform API
  access on a visitor token; it does NOT expose the Aervivo Connectivity Platform, the Aervivo
  Cloud OSS/BSS, or any Aervivo product API.
