aid: aervivo
name: Aervivo
description: Aervivo, Inc. is a San Diego, California company founded in 2020 that sells the Aervivo Connectivity
  Platform, a cloud operating system paired with the Aervivo Hybrid Edge ecosystem of fiber and fixed-wireless
  networking equipment (AerHub, AerSwitch). It lets multifamily property owners, fiber overbuilders, WISPs
  and incumbent ISPs deploy and operate community-wide gigabit managed WiFi without a full fiber build,
  bundling a virtualized core network with cloud-based OSS and BSS. Aervivo publishes no developer portal,
  API reference or machine-readable contract; its partner surface is a Salesforce Experience Cloud portal
  behind a login at portal.aervivo.com, and the only anonymous machine surface on its own hosts is the
  Wix Site MCP endpoint its marketing site serves.
